<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <radialGradient id="bgGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#0f2b26" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#070b14" stop-opacity="1"/>
    </radialGradient>
    <linearGradient id="emeraldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#34d399"/>
      <stop offset="50%" stop-color="#10b981"/>
      <stop offset="100%" stop-color="#059669"/>
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fde047"/>
      <stop offset="50%" stop-color="#eab308"/>
      <stop offset="100%" stop-color="#ca8a04"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background Base -->
  <rect width="512" height="512" rx="110" fill="url(#bgGlow)"/>
  <rect width="504" height="504" x="4" y="4" rx="106" fill="none" stroke="#10b981" stroke-opacity="0.3" stroke-width="3"/>

  <!-- Crossed Swords (Backdrop) -->
  <g stroke="url(#emeraldGrad)" stroke-width="8" stroke-linecap="round" opacity="0.65">
    <line x1="120" y1="120" x2="392" y2="392"/>
    <line x1="392" y1="120" x2="120" y2="392"/>
    <!-- Hilts -->
    <line x1="95" y1="145" x2="145" y2="95" stroke-width="10"/>
    <line x1="367" y1="95" x2="417" y2="145" stroke-width="10"/>
  </g>

  <!-- Glowing Aura -->
  <circle cx="256" cy="256" r="140" fill="#10b981" opacity="0.12" filter="url(#glow)"/>

  <!-- Hourglass Base & Top Caps -->
  <path d="M 160 110 L 352 110 L 336 140 L 176 140 Z" fill="url(#goldGrad)" />
  <path d="M 160 402 L 352 402 L 336 372 L 176 372 Z" fill="url(#goldGrad)" />
  <rect x="180" y="96" width="152" height="14" rx="7" fill="#fef08a" />
  <rect x="180" y="402" width="152" height="14" rx="7" fill="#fef08a" />

  <!-- Hourglass Glass Chamber -->
  <path d="M 176 140 C 176 220, 230 240, 236 256 C 230 272, 176 292, 176 372 L 336 372 C 336 292, 282 272, 276 256 C 282 240, 336 220, 336 140 Z" 
        fill="rgba(16, 185, 129, 0.08)" stroke="#34d399" stroke-width="6" stroke-linecap="round" />

  <!-- Magic Sand / Liquid Energy -->
  <!-- Top Sand -->
  <path d="M 195 180 C 220 200, 292 200, 317 180 L 325 155 L 187 155 Z" fill="url(#emeraldGrad)" opacity="0.9"/>
  <!-- Stream -->
  <line x1="256" y1="210" x2="256" y2="330" stroke="#6ee7b7" stroke-width="4" stroke-linecap="round" stroke-dasharray="8 6"/>
  <!-- Bottom Sand Pile -->
  <path d="M 190 365 C 220 315, 292 315, 322 365 Z" fill="url(#emeraldGrad)" filter="url(#glow)"/>

  <!-- Central Sparkle / Star of Focus -->
  <circle cx="256" cy="256" r="7" fill="#ffffff" filter="url(#glow)"/>
  <path d="M 256 240 L 260 252 L 272 256 L 260 260 L 256 272 L 252 260 L 240 256 L 252 252 Z" fill="#ffffff"/>

  <!-- Reward Coins Floating -->
  <g transform="translate(100, 270)">
    <circle cx="0" cy="0" r="28" fill="url(#goldGrad)" stroke="#fef08a" stroke-width="3" filter="url(#glow)"/>
    <text x="0" y="8" font-family="system-ui, sans-serif" font-size="22" font-weight="bold" fill="#713f12" text-anchor="middle">🪙</text>
  </g>
  <g transform="translate(412, 270)">
    <circle cx="0" cy="0" r="28" fill="url(#goldGrad)" stroke="#fef08a" stroke-width="3" filter="url(#glow)"/>
    <text x="0" y="8" font-family="system-ui, sans-serif" font-size="22" font-weight="bold" fill="#713f12" text-anchor="middle">★</text>
  </g>
</svg>
