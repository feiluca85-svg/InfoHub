<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <meta name="theme-color" content="#000000">
  <meta name="description" content="Meteo - Previsioni meteo in stile Windows Phone 8">
  <title>Meteo</title>

  <!-- PWA & iOS Meta Tags -->
  <link rel="manifest" href="manifest.json?v=20260727_v600">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="Meteo">
  <meta name="application-name" content="Meteo">
  <meta property="og:title" content="Meteo">
  <meta property="og:site_name" content="Meteo">
  <meta property="og:type" content="website">
  <meta property="og:image" content="https://feiluca85-svg.github.io/InfoHub/meteo/apple-touch-icon.png">

  <!-- iOS Apple Touch Icons (Absolute & Relative) -->
  <link rel="apple-touch-icon" href="https://feiluca85-svg.github.io/InfoHub/meteo/apple-touch-icon.png">
  <link rel="apple-touch-icon-precomposed" href="https://feiluca85-svg.github.io/InfoHub/meteo/apple-touch-icon.png">
  <link rel="apple-touch-icon" href="apple-touch-icon.png?v=20260727_v600">
  <link rel="apple-touch-icon-precomposed" href="apple-touch-icon.png?v=20260727_v600">
  <link rel="icon" href="icon-192.png?v=20260727_v600" type="image/png">

  <!-- Fonts & Styles -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css?v=20260727_v600">
</head>
<body>
  <div id="meteoApp">
    <!-- Header -->
    <header class="meteo-header">
      <div class="meteo-title-group">
        <span class="meteo-sub-title">meteo</span>
        <h1 id="meteoCityName" class="meteo-city-name">Roma</h1>
      </div>
      <div class="meteo-header-actions">
        <button id="gpsBtn" class="metro-icon-btn" title="Posizione attuale GPS" aria-label="GPS">
          <svg viewBox="0 0 24 24" width="20" height="20" stroke="currentColor" stroke-width="2" fill="none">
            <polygon points="12 2 19 21 12 17 5 21 12 2"></polygon>
          </svg>
        </button>
        <button id="sidebarToggleBtn" class="metro-icon-btn" title="Città salvate" aria-label="Menu città">
          <svg viewBox="0 0 24 24" width="22" height="22" stroke="currentColor" stroke-width="2" fill="none">
            <line x1="3" y1="12" x2="21" y2="12"></line>
            <line x1="3" y1="6" x2="21" y2="6"></line>
            <line x1="3" y1="18" x2="21" y2="18"></line>
          </svg>
        </button>
        <button id="refreshBtn" class="metro-icon-btn" title="Aggiorna meteo" aria-label="Aggiorna">
          <svg viewBox="0 0 24 24" width="20" height="20" stroke="currentColor" stroke-width="2" fill="none">
            <path d="M23 4v6h-6"></path>
            <path d="M1 20v-6h6"></path>
            <path d="M3.51 9a9 9 0 0 1 14.85-3.36L23 10M1 14l4.64 4.36A9 9 0 0 0 20.49 15"></path>
          </svg>
        </button>
      </div>
    </header>

    <!-- Extreme Weather Alert Banner -->
    <div id="meteoAlertBanner" class="meteo-alert-banner hidden">
      <span id="meteoAlertIcon">
        <svg viewBox="0 0 24 24" width="22" height="22" stroke="currentColor" stroke-width="2" fill="none"><path d="M10.29 3.86L1.82 18a2 2 0 0 0 1.71 3h16.94a2 2 0 0 0 1.71-3L13.71 3.86a2 2 0 0 0-3.42 0z"></path><line x1="12" y1="9" x2="12" y2="13"></line><line x1="12" y1="17" x2="12.01" y2="17"></line></svg>
      </span>
      <span id="meteoAlertText">Allerta Meteo</span>
    </div>

    <!-- Main Vertical Scroll Body -->
    <main class="meteo-body">
      <!-- 1. Current Weather Hero Card -->
      <section class="weather-hero-card">
        <div class="weather-hero-top">
          <div id="weatherHeroTemp" class="weather-huge-temp">--&deg;</div>
          <div id="weatherHeroIcon" class="weather-hero-icon"></div>
        </div>
        <div id="weatherHeroDesc" class="weather-hero-desc">Caricamento...</div>
        <div id="weatherHeroDetails" class="weather-hero-details">Vento: -- km/h • Umidità: --% • Max: --° / Min: --°</div>
      </section>

      <!-- 2. Smart Tip Card ("CONSIGLIO" without WP8) -->
      <section class="smart-tip-card">
        <span class="smart-tip-badge">consiglio</span>
        <p id="smartTipText" class="smart-tip-text">Caricamento consiglio meteo...</p>
      </section>

      <!-- 3. Astro (Alba/Tramonto) & Air Quality Grid -->
      <section class="metro-info-grid">
        <!-- Alba & Tramonto Stacked Metro Tile -->
        <div class="metro-info-tile astro-tile">
          <!-- Top Alba Block -->
          <div class="astro-block">
            <span class="astro-label">ALBA</span>
            <div class="astro-content">
              <div class="astro-icon-box">
                <svg viewBox="0 0 24 24" width="20" height="20" stroke="currentColor" stroke-width="1.8" fill="none"><path d="M17 18a5 5 0 0 0-10 0"></path><line x1="12" y1="2" x2="12" y2="9"></line><polyline points="9 5 12 2 15 5"></polyline><line x1="2" y1="18" x2="22" y2="18"></line></svg>
              </div>
              <span id="sunriseTime" class="astro-time">--:--</span>
            </div>
          </div>
          <div class="astro-divider"></div>
          <!-- Bottom Tramonto Block -->
          <div class="astro-block">
            <span class="astro-label">TRAMONTO</span>
            <div class="astro-content">
              <div class="astro-icon-box">
                <svg viewBox="0 0 24 24" width="20" height="20" stroke="currentColor" stroke-width="1.8" fill="none"><path d="M17 18a5 5 0 0 0-10 0"></path><line x1="12" y1="9" x2="12" y2="16"></line><polyline points="9 13 12 16 15 13"></polyline><line x1="2" y1="18" x2="22" y2="18"></line></svg>
              </div>
              <span id="sunsetTime" class="astro-time">--:--</span>
            </div>
          </div>
        </div>

        <!-- Air Quality Metro Tile -->
        <div class="metro-info-tile aqi-tile">
          <div class="tile-icon">
            <svg viewBox="0 0 24 24" width="26" height="26" stroke="currentColor" stroke-width="1.8" fill="none"><path d="M11 20A7 7 0 0 1 9.8 6.1C15.5 5 17 4.48 19 2c1 2 2 4.18 2 8 0 5.5-4.78 10-10 10Z"></path><path d="M2 21c0-3 1.85-5.36 5.08-6C9.5 14.52 12 13 13 12"></path></svg>
          </div>
          <div class="tile-content">
            <span class="tile-label">qualità dell'aria</span>
            <div id="aqiText" class="tile-value">In rilevamento...</div>
          </div>
        </div>
      </section>

      <!-- 4. Hourly Forecast Section -->
      <section class="forecast-section">
        <h2 class="forecast-section-title">prossime 24 ore (orario)</h2>
        <div id="hourlyList" class="hourly-list">
          <!-- Generated dynamically -->
        </div>
      </section>

      <!-- 5. 7-Day Forecast Section -->
      <section class="forecast-section">
        <h2 class="forecast-section-title">prossimi 7 giorni</h2>
        <div id="forecastList" class="forecast-list">
          <!-- Generated dynamically -->
        </div>
      </section>
    </main>

    <!-- Sidebar Overlay & Cities List -->
    <div id="sidebarOverlay" class="sidebar-overlay hidden"></div>
    <aside id="sidebar" class="metro-sidebar">
      <div class="sidebar-header">
        <h2>città salvate</h2>
        <div style="display:flex; gap:8px; align-items:center;">
          <button id="toggleDeleteCitiesBtn" class="metro-icon-btn" title="Elimina città" aria-label="Attiva modalità eliminazione" style="width:30px; height:30px; font-size:1.1rem; padding:0; display:flex; align-items:center; justify-content:center;">&minus;</button>
          <button id="closeSidebarBtn" class="close-modal-btn">&times;</button>
        </div>
      </div>
      <div id="citiesListContainer" class="cities-list-container">
        <!-- Generated dynamically -->
      </div>
      <div class="sidebar-footer">
        <button id="addCityBtn" class="metro-list-btn">+ cerca e aggiungi città</button>
      </div>
    </aside>

    <!-- Add City Dialog -->
    <dialog id="addCityModal" class="reader-dialog">
      <div class="reader-dialog-content">
        <header class="reader-header">
          <h2 style="font-weight:300;">cerca città</h2>
          <button id="closeAddCityBtn" class="close-modal-btn">&times;</button>
        </header>
        <div style="padding: 20px;">
          <div style="display:flex; gap:10px;">
            <input type="text" id="citySearchInput" placeholder="Es: Milano, Napoli, Parigi, Londra..." autocomplete="off" style="flex:1; padding:14px; background:#222; border:1px solid #444; color:white; font-size:1rem; outline:none;">
            <button id="searchCityBtn" class="metro-list-btn" style="flex:0 0 auto; width:auto; padding:0 18px;">Cerca</button>
          </div>
          <div id="citySearchResults" class="search-results-list"></div>
        </div>
      </div>
    </dialog>
  </div>

  <script src="app.js?v=20260727_v600"></script>
</body>
</html>
